services:
  order-db:
    image: postgres:latest
    container_name: order-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - order_data:/var/lib/postgresql/data
  
  order-service:
    build: .
    container_name: order-service
    ports:
      - "8080:8080"
    depends_on:
      - order-db

volumes:
  order_data: