services:
  inventory-db:
    image: mysql:latest
    container_name: inventory-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - inventory_data:/var/lib/mysql

  inventory-service:
    build: .
    container_name: inventory-service
    ports:
      - "8080:8080"
    depends_on:
      - product-db

volumes:
  inventory_data:

